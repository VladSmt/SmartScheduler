welcome.uk=<b>Привіт! Я твій AI-планувальник.</b> 🚀\n\n\
    Я допоможу тобі не провтикати дедлайни та організувати хаос у справах.\n\n\
    <b>Що я вмію:</b>\n\
    • Створювати таски з простого тексту.\n\
    • Нагадувати про важливе.\n\
    • Аналізувати твій розклад через AI.\n\n\
    <b>Основні команди:</b>\n\
    /add — Додати нову таску\n\
    /list — Глянути, що там на сьогодні\n\
    /settings — Змінити режим (Manual/AI)\n\n\
    <i>Спробуй написати "Купити хліб о 18:00", або натисни кнопку нижче.</i>
